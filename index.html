<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:12px/1.3 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:var(--tx);background:#1b2030;border:1px solid var(--ln);border-radius:3px;padding:3px 7px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#111;border-color:var(--ac)}

#grid{flex:1;display:grid;gap:1px;background:var(--ln);min-width:0}

.cell.act{outline-color:var(--ac)}

.cv{flex:1;min-height:0}

.it{display:flex;gap:6px;align-items:center;padding:5px 3px;border-bottom:1px solid var(--ln);cursor:pointer}.it:hover{background:#1b2030}

</style></head><body>

<script>
const D=document,$=s=>D.querySelector(s),TFS=['1m','5m','15m','30m','1h','4h','7h','D'];
const NAT=[10080,1440,720,480,360,240,120,60,30,15,5,3,1],BN={1:'1m',3:'3m',5:'5m',15:'15m',30:'30m',60:'1h',120:'2h',240:'4h',360:'6h',480:'8h',720:'12h',1440:'1d',10080:'1w'};
async function jget(u){const via=()=>fetch(`${S.bridge}/fetch?url=${encodeURIComponent(u)}`).then(r=>r.json());if(/\/\/api\.(mexc|kucoin)\.com/.test(u)){try{return await via()}catch(e){}}try{const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}catch(e){return via()}}
const COLS=['#9aa0b0','#ef5350','#26a69a','#e6b422','#4c8dff','#b06cf0'];
const LAY={1:[1,1],2:[2,1],4:[2,2],6:[3,2],8:[4,2]};
const STYLES=['bars','candles','hollow','volume-candles','high-low','line','line-markers','step','area','hlc-area','baseline','columns','heikin-ashi','renko','line-break','kagi','point-figure','range','footprint'];
function styleBars(data,style){
 if(style==='heikin-ashi'){let prev=null;return data.map(x=>{const close=(x.open+x.high+x.low+x.close)/4,open=prev?(prev.open+prev.close)/2:(x.open+x.close)/2,b={...x,open,close,high:Math.max(x.high,open,close),low:Math.min(x.low,open,close)};prev=b;return b})}
 if(!['renko','range','line-break','kagi','point-figure'].includes(style)||!data.length)return data;
 const sample=data.slice(-20),box=Math.max(Number.EPSILON,sample.reduce((sum,x)=>sum+x.high-x.low,0)/sample.length*.5),out=[];let close=data[0].close,trend=0,prevCloses=[];
 if(style==='line-break'){out.push(...data.slice(0,3));for(const x of data.slice(3)){const recent=out.slice(-3),hi=Math.max(...recent.map(b=>b.close)),lo=Math.min(...recent.map(b=>b.close));if(x.close>hi||x.close<lo)out.push({...x,open:out[out.length-1].close})}return out}
 for(const x of data.slice(1)){const delta=x.close-close,dir=Math.sign(delta);if(!dir)continue;let threshold=box;if(style==='kagi'&&trend&&dir!==trend)threshold*=2;if(style==='point-figure'&&trend&&dir!==trend)threshold*=3;
  if(style==='point-figure'&&trend&&dir!==trend&&Math.abs(delta)<threshold)continue;
  if(style==='kagi'&&trend&&dir!==trend&&Math.abs(delta)<threshold)continue;
  if(style==='range'&&Math.abs(delta)<box)continue;
  if(Math.abs(delta)<box&&style!=='point-figure'&&style!=='kagi')continue;
  const next=style==='range'?x.close:close+dir*box,b={time:x.time,open:close,close:next,high:Math.max(close,next),low:Math.min(close,next),volume:x.volume};
  if(out.length&&out[out.length-1].time===b.time)out[out.length-1]=b;else out.push(b);close=next;trend=dir;prevCloses.push(close)}
 return out.length?out:data.slice(0,1)
}
function priceDigits(v){const parts=Number(v).toString().toLowerCase().split('e');return Math.max(0,(parts[0].split('.')[1]||'').length-(Number(parts[1])||0))}
function pricePrecision(data){let p=2;data.forEach(x=>['open','high','low','close'].forEach(k=>p=Math.max(p,priceDigits(x[k]))));return Math.min(p,100)}
const LOCAL=location.protocol==='file:'||/^(localhost|127\.)/.test(location.hostname),DEFSYM=LOCAL?'MT5:EURUSD':'FX:EURUSD';
const mkTab=n=>({name:n,lay:1,ch:Array.from({length:8},(_,i)=>({sym:DEFSYM,tf:['1m','5m','15m','30m','1h','4h','D','W'][i]}))});
let S={tabs:[mkTab('Tab 1')],tab:0,sync:true,bridge:'http://localhost:5000',ind:{rsi:0,ao:0,ob:0},
 wlc:'All Exchanges',wl:{
   'All Exchanges':[{s:DEFSYM,l:'eurusd',c:3},{s:'BTCUSDT',l:'Binance',c:2},{s:'ETHUSDT',l:'Binance',c:2},{s:'SOLUSDT',l:'Binance',c:2}],
   'Crypto Top':['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','AVAXUSDT','LINKUSDT','NEARUSDT'].map(s=>({s,l:'',c:0}))
 }};

try{
  const r=localStorage.getItem('mcp');
  if(r){
    const parsed=JSON.parse(r);
    S=Object.assign(S,parsed);
  }

if(/^https?:$/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname)&&/localhost|127\.0\.0\.1/.test(S.bridge))S.bridge=location.origin;
const save=()=>{try{localStorage.setItem('mcp',JSON.stringify(S))}catch(e){}};
let charts=[],act=null,tool='cur';

/* ---------- helpers ---------- */
function parseTf(s){s=String(s).trim().toLowerCase();if(s==='d')return 1440;if(s==='w')return 10080;const m=s.match(/^(\d*)(m|h|d|w)$/);if(!m)return 0;return(+m[1]||1)*{m:1,h:60,d:1440,w:10080}[m[2]]}
function agg(d,sec){if(sec<=0)return d;const o=[];for(const x of d){const t=Math.floor(x.time/sec)*sec,l=o[o.length-1];if(l&&l.time===t){l.high=Math.max(l.high,x.high);l.low=Math.min(l.low,x.low);l.close=x.close;l.volume+=x.volume}else o.push({...x,time:t})}return o}
async function bn(s,n,pages=3){let out=[],end='';for(let p=0;p<pages;p++){const j=await jget(`https://api.binance.com/api/v3/klines?symbol=${s}&interval=${BN[n]}&limit=1000${end}`);if(!Array.isArray(j)){if(!out.length)throw Error('Binance: '+(j&&j.msg||'no data for '+s));break}if(!j.length)break;out=j.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]})).concat(out);end='&endTime='+(j[0][0]-1);if(j.length<1000)break}return out}
const XTF={BN:BN,MEXC:{1:'1m',5:'5m',15:'15m',30:'30m',60:'60m',240:'4h',1440:'1d',10080:'1W'},BYBIT:{1:'1',3:'3',5:'5',15:'15',30:'30',60:'60',120:'120',240:'240',360:'360',720:'720',1440:'D',10080:'W'},OKX:{1:'1m',3:'3m',5:'5m',15:'15m',30:'30m',60:'1H',120:'2H',240:'4H',360:'6H',720:'12H',1440:'1D',10080:'1W'},GATE:{1:'1m',5:'5m',15:'15m',30:'30m',60:'1h',240:'4h',480:'8h',1440:'1d',10080:'7d'},KUCOIN:{1:'1min',3:'3min',5:'5min',15:'15min',30:'30min',60:'1hour',120:'2hour',240:'4hour',360:'6hour',480:'8hour',720:'12hour',1440:'1day',10080:'1week'}};
const venueSymbol=(src,s)=>src==='OKX'||src==='KUCOIN'?s.replace(/USDT$/,'-USDT'):src==='GATE'?s.replace(/USDT$/,'_USDT'):s;
async function exJson(src,kind,url){return jget(url)}

/* ---------- FREE FOREX / METALS (no MT5 bridge): Yahoo Finance via Cloudflare Worker or public CORS proxies ---------- */
const FXC=new Set('USD EUR GBP JPY AUD NZD CAD CHF SEK NOK DKK SGD HKD MXN ZAR TRY PLN CZK HUF CNH CNY INR THB XAU XAG'.split(' '));
function fxName(s){return String(s).toUpperCase().replace(/[\/\-_ ]/g,'')}
function fxYahoo(s){const n=fxName(s);if(/[=^]/.test(n))return[n];
 const M={XAUUSD:['XAUUSD=X','GC=F'],XAGUSD:['XAGUSD=X','SI=F'],USDCNH:['CNH=X','USDCNH=X']};
 if(M[n])return M[n];const a=[n+'=X'];if(n.startsWith('USD'))a.push(n.slice(3)+'=X');return a}
function isFx(s){const n=fxName(s);return n.length===6&&FXC.has(n.slice(0,3))&&FXC.has(n.slice(3))&&n.slice(0,3)!==n.slice(3)}
const FXI={1:['1m','7d'],5:['5m','60d'],15:['15m','60d'],30:['30m','60d'],60:['60m','730d'],1440:['1d','10y'],10080:['1wk','10y']};
XTF.FX={1:1,5:1,15:1,30:1,60:1,1440:1,10080:1};
let fxOk=0;
async function fxGet(path){const y='https://query1.finance.yahoo.com'+path,T=[];
 if(/^https?:$/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname))T.push(()=>fetch('/fx?path='+encodeURIComponent(path)));
 if(S.bridge&&S.bridge!==location.origin)T.push(()=>fetch(`${S.bridge}/fx?path=${encodeURIComponent(path)}`));
 T.push(()=>fetch('https://corsproxy.io/?url='+encodeURIComponent(y)),()=>fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(y)),()=>fetch(y));
 let err;for(let k=0;k<T.length;k++){const i=(fxOk+k)%T.length;try{const r=await T[i]();if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();fxOk=i;return j}catch(e){err=e}}
 throw err||Error('FX source unreachable')}
async function fx(s,n,c){const[iv,rg0]=FXI[n];const rg=c>2?rg0:n>=10080?'1mo':n>=1440?'5d':'1d';let last;
 for(const ys of fxYahoo(s)){try{const j=await fxGet(`/v8/finance/chart/${encodeURIComponent(ys)}?interval=${iv}&range=${rg}&includePrePost=false`);
  const r=j.chart&&j.chart.result&&j.chart.result[0];if(!r||!r.timestamp)throw Error('No FX data for '+s);const q=r.indicators.quote[0],o=[];
  r.timestamp.forEach((t,i)=>{if(q.open[i]==null||q.close[i]==null||q.high[i]==null||q.low[i]==null)return;o.push({time:t,open:q.open[i],high:q.high[i],low:q.low[i],close:q.close[i],volume:(q.volume&&q.volume[i])||0})});
  if(o.length)return c>2?o:o.slice(-c)}catch(e){last=e}}
 throw last||Error('No FX data for '+s)}
const FXLIST=['XAUUSD','XAGUSD','EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','NZDUSD','USDCAD','EURGBP','EURJPY','EURCHF','EURAUD','EURNZD','EURCAD','GBPJPY','GBPCHF','GBPAUD','GBPNZD','GBPCAD','AUDJPY','AUDNZD','AUDCAD','AUDCHF','NZDJPY','NZDCAD','NZDCHF','CADJPY','CADCHF','CHFJPY','USDSEK','USDNOK','USDSGD','USDHKD','USDMXN','USDZAR','USDTRY','USDCNH','USDINR'];
S.wl.Forex=S.wl.Forex||FXLIST.map(s=>({s:'FX:'+s,l:s==='XAUUSD'?'gold':'',c:s==='XAUUSD'?3:0}));
{const dl=document.createElement('datalist');dl.id='fxl';dl.innerHTML=FXLIST.map(s=>`<option value="FX:${s}">`).join('');document.body.appendChild(dl)}
async function exCandles(src,s,n,c=1000){const i=XTF[src]?.[n];if(!i)throw Error('Unsupported timeframe');let u,j;
 if(src==='FX')return fx(s,n,c);
 if(src==='BN')return bn(s,n);
 if(src==='MEXC'){u=`https://api.mexc.com/api/v3/klines?symbol=${s}&interval=${i}&limit=${c}`;j=await exJson(src,'candles',u);if(!Array.isArray(j))throw Error('MEXC candles unavailable');return j.map(k=>({time:+k[0]>1e12?+k[0]/1000:+k[0],open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]})).sort((a,b)=>a.time-b.time)}
 if(src==='BYBIT'){u=`https://api.bybit.com/v5/market/kline?category=spot&symbol=${s}&interval=${i}&limit=${c}`;j=await jget(u);if(j.retCode!==0)throw Error(j.retMsg||'Bybit candles unavailable');return j.result.list.map(k=>({time:+k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]})).sort((a,b)=>a.time-b.time)}
 if(src==='OKX'){u=`https://www.okx.com/api/v5/market/candles?instId=${venueSymbol(src,s)}&bar=${i}&limit=${Math.min(c,300)}`;j=await jget(u);if(j.code!=='0')throw Error(j.msg||'OKX candles unavailable');return j.data.map(k=>({time:+k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]})).sort((a,b)=>a.time-b.time)}
 if(src==='GATE'){u=`https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=${venueSymbol(src,s)}&interval=${i}&limit=${c}`;j=await jget(u);if(!Array.isArray(j))throw Error('Gate.io unavailable');return j.map(k=>({time:+k[0],open:+k[5],high:+k[3],low:+k[4],close:+k[2],volume:+k[1]})).sort((a,b)=>a.time-b.time)}
 if(src==='KUCOIN'){u=`https://api.kucoin.com/api/v1/market/candles?symbol=${venueSymbol(src,s)}&type=${i}&limit=${c}`;j=await exJson(src,'candles',u);if(j.code!=='200000')throw Error(j.msg||'KuCoin unavailable');return j.data.slice(0,c).map(k=>({time:+k[0],open:+k[1],high:+k[3],low:+k[4],close:+k[2],volume:+k[5]})).sort((a,b)=>a.time-b.time)}
 throw Error('Unknown exchange')}

async function mt5(s,n,c=1000){
  try{
    const r=await fetch(`${S.bridge}/candles?symbol=${encodeURIComponent(s)}&tf=${n}&count=${c}&_=${Date.now()}`, {cache:'no-store'});
    const j=await r.json();
    if(!r.ok||j.error)throw Error(j.error||`MT5 bridge returned HTTP ${r.status}`);
    if(!Array.isArray(j))throw Error('MT5 bridge returned invalid candle data');
    $('#st').className='ok';
    return j.map(k=>({time:k.time,open:k.open,high:k.high,low:k.low,close:k.close,volume:k.volume||k.tick_volume||0}))
  }catch(e){
    $('#st').className='';
    throw e
  }
}

function demo(n){let p=4280,t=Math.floor(Date.now()/1000/(n*60))*n*60;const o=[];for(let i=500;i>0;i--){const a=p,c=a+(Math.random()-.5)*6,h=Math.max(a,c)+Math.random()*2,l=Math.min(a,c)-Math.random()*2;o.push({time:t-i*n*60,open:a,high:h,low:l,close:c,volume:Math.random()*900+100});p=c}return o}
function rsi(a,n=14){let g=0,l=0;const o=[];for(let i=1;i<a.length;i++){const d=a[i].close-a[i-1].close,u=Math.max(d,0),v=Math.max(-d,0);if(i<=n){g+=u/n;l+=v/n}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+v)/n}if(i>=n)o.push({time:a[i].time,value:l?100-100/(1+g/l):100})}return o}
function ao(a){const m=a.map(x=>(x.high+x.low)/2),sm=(i,n)=>{let s=0;for(let j=i-n+1;j<=i;j++)s+=m[j];return s/n},o=[];for(let i=33;i<a.length;i++){const v=sm(i,5)-sm(i,34);o.push({time:a[i].time,value:v,color:o.length&&v<o[o.length-1].value?'#ef5350':'#26a69a'})}return o}
function obs(a){const out=[];for(let i=14;i<a.length;i++){let s=0,vs=0;for(let j=i-14;j<i;j++){s+=a[j].high-a[j].low;vs+=a[j].volume}const atr=s/14,c=a[i];if(Math.abs(c.close-c.open)>1.5*atr&&c.volume>1.3*vs/14){const up=c.close>c.open;for(let j=i-1;j>=i-5&&j>=0;j--){const p=a[j];if(up?p.close<p.open:p.close>p.open){out.push({up,i:j,hi:p.high,lo:p.low,vol:p.volume+c.volume});break}}}}
 return out.filter(o=>{for(let k=o.i+2;k<a.length;k++)if(o.up?a[k].close<a[k].lo:a[k].close>o.hi)return false;return true}).slice(-6)}
const fk=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0);

/* ---------- chart cell ---------- */
class Ch{

 updateOhlc(p){const a=this.view(),b=p&&p.time?a.find(x=>x.time===p.time):a[a.length-1];if(!b){this.ohlc.textContent='';return}const f=v=>v.toFixed(this.precision||2);this.ohlc.textContent=`O ${f(b.open)} H ${f(b.high)} L ${f(b.low)} C ${f(b.close)}`;this.ohlc.title=`Open ${f(b.open)} · High ${f(b.high)} · Low ${f(b.low)} · Close ${f(b.close)}`}
 render(fit){this.ag=agg(this.raw,this.tfm*60);this.setPrecision(this.raw);const v=this.view();this.s.setData(this.seriesData(v));if(this.style==='footprint'&&v.length>18){const end=v.length-1;this.c.timeScale().setVisibleLogicalRange({from:Math.max(0,end-17),to:end+2})}else if(fit)this.c.timeScale().fitContent();else this.c.timeScale().scrollToRealTime();this.n=v.length;this.px.textContent=(this.ok?(this.via?this.via+' · ':''):'DEMO · ')+(v.length?v[v.length-1].close.toFixed(this.precision):'');this.px.title=this.ok?('live'+(this.via?' via '+this.via:'')):'Demo data: '+(this.err||'source unreachable');this.updateOhlc();this.ind()}
 live(){if(this.src==='MT5'){const t=this.tok,poll=async()=>{if(t!==this.tok)return;try{const data=await mt5(this.name,this.nat,2);if(t!==this.tok)return;if(!this.ok){this.raw=data;this.ok=1;this.err='';this.render(0)}else data.forEach(x=>this.tick(x))}catch(e){if(t===this.tok){this.err=String(e&&e.message||e);this.px.title='MT5 bridge unavailable: '+this.err}}if(t===this.tok)this.iv=setTimeout(poll,1000)};this.iv=setTimeout(poll,1000);return}if(!this.ok)return;if(this.src==='BN'){const w=this.ws=new WebSocket(`wss://stream.binance.com:9443/ws/${this.name.toLowerCase()}@kline_${BN[this.nat]}`);w.onmessage=e=>{const k=JSON.parse(e.data).k;this.tick({time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v})}}
